services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
